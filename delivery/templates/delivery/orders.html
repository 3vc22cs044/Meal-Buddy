{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Order Summary | Meal Buddy</title>
    <link rel="stylesheet" href="{% static 'delivery/css/base.css' %}">
    <link rel="stylesheet" href="{% static 'delivery/css/pages.css' %}">
</head>
<body class="site-page">
    <a class="skip-link" href="#main-content">Skip to content</a>
    <header class="site-header">
        <div class="nav-shell">
            <a class="brand" href="/">
                <span class="brand-mark">MB</span>
                <span>Meal Buddy</span>
            </a>
            <nav class="nav-links" aria-label="Primary">
                <a class="nav-link" href="/">Home</a>
            </nav>
        </div>
    </header>

    <main id="main-content" class="site-main result-panel">
        <section class="card result-card" aria-labelledby="order-title">
            <div class="result-mark success">OK</div>
            <p class="eyebrow">Order placed</p>
            <h1 id="order-title">Thank you, {{ username }}</h1>
            <p class="lead">Your order will be delivered to this location shortly. Thank you for choosing Meal Mate.</p>

            <div class="address-box">
                <h2>Delivery address</h2>
                <p>{{ customer.address }}</p>
            </div>

            <div class="actions">
                <a class="btn" href="{% url 'my_orders' username %}">My orders</a>
            </div>
        </section>
    </main>

    <footer class="site-footer">
        <div class="footer-shell">Meal Buddy</div>
    </footer>
</body>
</html>
